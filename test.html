<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Splitter — Tests</title>
  <style>
    body { font-family: monospace; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #111; color: #eee; }
    h1 { font-size: 1.2rem; margin-bottom: 4px; }
    h2 { font-size: 0.95rem; color: #aaa; margin: 28px 0 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    .result { padding: 4px 0; font-size: 0.88rem; }
    .pass { color: #4caf50; }
    .fail { color: #f44336; }
    #summary { margin-top: 24px; font-size: 1rem; font-weight: bold; padding: 10px; border-radius: 4px; }
    .all-pass { background: #1b3a1f; color: #4caf50; }
    .has-fail { background: #3a1b1b; color: #f44336; }
  </style>
</head>
<body>
  <h1>Splitter — Test Suite</h1>
  <div id="output"></div>
  <div id="summary"></div>

  <script src="logic.js"></script>
  <script>

    // ── Runner ────────────────────────────────────────────────────────────────

    const results = [];
    let currentGroup = '';

    // Starts a new section: every assertion that follows is listed under this name
    function group(name) { currentGroup = name; }

    function assert(label, actual, expected) {
      const pass = JSON.stringify(actual) === JSON.stringify(expected);
      results.push({ label, pass, actual, expected, group: currentGroup });
    }

    function assertDeepUnordered(label, actual, expected) {
      const norm = arr => [...arr].sort((a, b) =>
        (a.from + a.to + a.amount) < (b.from + b.to + b.amount) ? -1 : 1
      );
      assert(label, norm(actual), norm(expected));
    }

    // ── computeBalances ───────────────────────────────────────────────────────

    group('computeBalances');

    const members = ['Alice', 'Bob', 'Davide'];
    const ZERO = { Alice: 0, Bob: 0, Davide: 0 };
    const ex = (paidBy, amount, participants) => ({ paidBy, amount, participants });

    assert(
      'No expenses → all balances are 0',
      computeBalances(members, [], []),
      ZERO
    );

    assert(
      'One expense, Alice pays 90, all 3 participate equally',
      computeBalances(members, [
        ex('Alice', 90, ['Alice', 'Bob', 'Davide'])
      ], []),
      { Alice: 60, Bob: -30, Davide: -30 }
    );

    assert(
      'Payer is NOT a participant (Alice pays 90, only Bob and Davide split)',
      computeBalances(members, [
        ex('Alice', 90, ['Bob', 'Davide'])
      ], []),
      { Alice: 90, Bob: -45, Davide: -45 }
    );

    assert(
      'Payer is participant: Alice pays 60, Alice and Bob split',
      computeBalances(members, [
        ex('Alice', 60, ['Alice', 'Bob'])
      ], []),
      { Alice: 30, Bob: -30, Davide: 0 }
    );

    assert(
      'Multiple expenses accumulate correctly',
      computeBalances(members, [
        ex('Alice', 90, ['Alice', 'Bob', 'Davide']),
        ex('Bob', 60, ['Alice', 'Bob'])
      ], []),
      { Alice: 30, Bob: 0, Davide: -30 }
    );

    assert(
      'Settlement clears debt between two people',
      computeBalances(members, [
        ex('Alice', 90, ['Alice', 'Bob', 'Davide'])
      ], [
        { from: 'Bob',    to: 'Alice', amount: 30 },
        { from: 'Davide', to: 'Alice', amount: 30 }
      ]),
      ZERO
    );

    assert(
      'Partial settlement reduces but does not clear debt',
      computeBalances(members, [
        ex('Alice', 90, ['Alice', 'Bob', 'Davide'])
      ], [
        { from: 'Bob', to: 'Alice', amount: 10 }
      ]),
      { Alice: 50, Bob: -20, Davide: -30 }
    );

    assert(
      'Floating point: 100 split 3 ways — the extra cent stays with the payer, balances sum to 0',
      computeBalances(members, [
        ex('Alice', 100, ['Alice', 'Bob', 'Davide'])
      ], []),
      { Alice: 66.66, Bob: -33.33, Davide: -33.33 }
    );

    // ── simplifyDebts ─────────────────────────────────────────────────────────

    group('simplifyDebts');

    assert(
      'All zero balances → no transactions',
      simplifyDebts(ZERO),
      []
    );

    assert(
      'One creditor, one debtor, exact amounts → one transaction',
      simplifyDebts({ Alice: 30, Bob: -30 }),
      [{ from: 'Bob', to: 'Alice', amount: 30 }]
    );

    assertDeepUnordered(
      'One creditor, two debtors → two transactions',
      simplifyDebts({ Alice: 60, Bob: -30, Davide: -30 }),
      [
        { from: 'Bob',    to: 'Alice', amount: 30 },
        { from: 'Davide', to: 'Alice', amount: 30 }
      ]
    );

    assertDeepUnordered(
      'Two creditors, one debtor → two transactions',
      simplifyDebts({ Alice: 30, Bob: 20, Davide: -50 }),
      [
        { from: 'Davide', to: 'Alice', amount: 30 },
        { from: 'Davide', to: 'Bob',   amount: 20 }
      ]
    );

    assertDeepUnordered(
      'Complex case: two debtors, two creditors',
      simplifyDebts({ Alice: 40, Bob: 20, Davide: -10, Eve: -50 }),
      [
        { from: 'Eve',    to: 'Alice', amount: 40 },
        { from: 'Eve',    to: 'Bob',   amount: 10 },
        { from: 'Davide', to: 'Bob',   amount: 10 }
      ]
    );

    assert(
      'Rounding: 33.33 + 33.33 owed to one creditor → two clean transactions',
      simplifyDebts({ Alice: 66.66, Bob: -33.33, Davide: -33.33 }),
      [{ from: 'Bob', to: 'Alice', amount: 33.33 }, { from: 'Davide', to: 'Alice', amount: 33.33 }]
    );

    assert(
      'Rounding: 0.1 + 0.2 style amounts give no floating point artifacts',
      simplifyDebts({ Alice: 0.3, Bob: -0.1, Davide: -0.2 }),
      [{ from: 'Davide', to: 'Alice', amount: 0.2 }, { from: 'Bob', to: 'Alice', amount: 0.1 }]
    );

    assert(
      'Balances below half a cent are treated as settled',
      simplifyDebts({ Alice: 0.004, Bob: -0.004 }),
      []
    );

    // ── Whole cents: balances always add up to exactly zero ──────────────────

    group('whole cents (sum of balances is zero)');

    const sum = o => Math.round(Object.values(o).reduce((a, b) => a + toCents(b), 0));

    assert('1 cent split 3 ways: nobody owes anything',
      computeBalances(members, [ex('Alice', 0.01, ['Alice', 'Bob', 'Davide'])], []),
      ZERO);

    assert('100.01 split between two non-payers: leftover cent goes to the first',
      computeBalances(members, [ex('Alice', 100.01, ['Bob', 'Davide'])], []),
      { Alice: 100.01, Bob: -50.01, Davide: -50 });

    assert('Payer in the middle of the list takes the leftover cent first',
      computeBalances(members, [ex('Bob', 100, ['Alice', 'Bob', 'Davide'])], []),
      { Alice: -33.33, Bob: 66.66, Davide: -33.33 });

    assert('Settlements of 0.1 and 0.2 add up to exactly 0.3',
      computeBalances(members, [ex('Alice', 0.3, ['Bob'])], [
        { from: 'Bob', to: 'Alice', amount: 0.1 }, { from: 'Bob', to: 'Alice', amount: 0.2 }
      ]),
      ZERO);

    assert('Amounts with more than 2 decimals are taken to the nearest cent',
      computeBalances(members, [ex('Alice', 12.345, ['Bob'])], []),
      { Alice: 12.35, Bob: -12.35, Davide: 0 });

    // Deterministic pseudo-random groups: sum of balances is 0 and the suggested payments settle everyone
    {
      let seed = 12345;
      const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
      let badSum = 0, badSettle = 0;
      for (let t = 0; t < 2000; t++) {
        const n = 2 + Math.floor(rnd() * 6);
        const ms = Array.from({ length: n }, (_, i) => 'P' + i);
        const exps = [];
        for (let k = 1 + Math.floor(rnd() * 6); k > 0; k--) {
          const parts = ms.filter(() => rnd() < 0.6);
          if (!parts.length) parts.push(ms[0]);
          exps.push({ paidBy: ms[Math.floor(rnd() * n)], amount: Math.round(rnd() * 20000) / 100 + 0.01, participants: parts });
        }
        const b = computeBalances(ms, exps, []);
        if (sum(b) !== 0) badSum++;
        const after = {};
        for (const m of ms) after[m] = toCents(b[m]);
        for (const tx of simplifyDebts(b)) { after[tx.from] += toCents(tx.amount); after[tx.to] -= toCents(tx.amount); }
        if (Object.values(after).some(v => v !== 0)) badSettle++;
      }
      assert('2000 random groups: balances sum to exactly 0', badSum, 0);
      assert('2000 random groups: suggested payments settle everyone exactly', badSettle, 0);
    }

    // ── Robustness: invalid data must not corrupt balances or hang ───────────

    group('robustness (invalid data, sanitizeState)');

    assert('Expense with no participants is ignored',
      computeBalances(members, [ex('Alice', 10, [])], []),
      ZERO);

    assert('Expense paid by a non-member is ignored (no NaN)',
      computeBalances(members, [ex('Zed', 10, ['Alice'])], []),
      ZERO);

    assert('Expense with a non-member participant is ignored (no NaN)',
      computeBalances(members, [ex('Alice', 10, ['Alice', 'Zed'])], []),
      ZERO);

    assert('Non-finite, negative, zero and huge amounts are ignored',
      computeBalances(members, [
        ex('Alice', Infinity, ['Bob']), ex('Alice', NaN, ['Bob']), ex('Alice', -5, ['Bob']),
        ex('Alice', 0, ['Bob']), ex('Alice', 1e308, ['Bob']), ex('Alice', '10', ['Bob'])
      ], []),
      ZERO);

    assert('Settlement with an unknown person is ignored',
      computeBalances(members, [], [{ from: 'Zed', to: 'Alice', amount: 5 }]),
      ZERO);

    assert('Member named "__proto__" is handled like any other',
      computeBalances(['__proto__', 'Bob'], [ex('Bob', 10, ['__proto__', 'Bob'])], []),
      JSON.parse('{"__proto__": -5, "Bob": 5}'));

    assert('Members whose names look like numbers keep their balance',
      computeBalances(['1', 'Bob'], [ex('Bob', 10, ['1', 'Bob'])], []),
      { '1': -5, Bob: 5 });

    assert('simplifyDebts ends (empty) on Infinity/NaN balances',
      simplifyDebts({ A: Infinity, B: -Infinity, C: NaN }),
      []);

    assert('simplifyDebts ignores a non-finite entry but still settles the rest',
      simplifyDebts({ A: 10, B: -10, C: NaN }),
      [{ from: 'B', to: 'A', amount: 10 }]);

    const empty = { members: [], expenses: [], settlements: [] };
    assert('sanitizeState(null) → empty state', sanitizeState(null), empty);
    assert('sanitizeState([]) → empty state', sanitizeState([]), empty);
    assert('sanitizeState with only members keeps them',
      sanitizeState({ members: ['A'] }), { members: ['A'], expenses: [], settlements: [] });
    assert('sanitizeState drops duplicate/non-string members',
      sanitizeState({ members: ['A', 'A', 3, '', null, 'B'] }).members, ['A', 'B']);

    const good = { id: 'x1', description: 'Pizza', amount: 12.5, paidBy: 'A', participants: ['A', 'B'], date: '2026-03-01' };
    const goodS = { id: 's1', from: 'B', to: 'A', amount: 3, date: '2026-03-02' };
    assert('sanitizeState keeps valid data unchanged (same stored format)',
      sanitizeState({ members: ['A', 'B'], expenses: [good], settlements: [goodS] }),
      { members: ['A', 'B'], expenses: [good], settlements: [goodS] });

    assert('sanitizeState drops broken expenses and settlements',
      sanitizeState({
        members: ['A', 'B'],
        expenses: [good, null, 5, { ...good, amount: 1e308 }, { ...good, participants: [] },
                   { ...good, paidBy: 'Z' }, { ...good, participants: ['A', 'Z'] }, { ...good, amount: '3' }],
        settlements: [goodS, { ...goodS, from: 'Z' }, { ...goodS, amount: -1 }, 'x']
      }),
      { members: ['A', 'B'], expenses: [good], settlements: [goodS] });

    assert('sanitizeState: expenses that is not an array does not throw',
      sanitizeState({ members: ['A'], expenses: 'oops', settlements: {} }),
      { members: ['A'], expenses: [], settlements: [] });

    // ── More computeBalances cases ────────────────────────────────────────────

    group('computeBalances (more cases)');

    assert(
      'Expense with a single participant who is also the payer → nobody owes anything',
      computeBalances(members, [ex('Alice', 25, ['Alice'])], []),
      ZERO
    );

    assert(
      'Very small amount (0.01) paid by Alice for Bob',
      computeBalances(members, [ex('Alice', 0.01, ['Bob'])], []),
      { Alice: 0.01, Bob: -0.01, Davide: 0 }
    );

    assert(
      'Several settlements between the same two people accumulate',
      computeBalances(members, [
        ex('Alice', 60, ['Bob'])
      ], [
        { from: 'Bob', to: 'Alice', amount: 10 },
        { from: 'Bob', to: 'Alice', amount: 20.5 },
        { from: 'Bob', to: 'Alice', amount: 5 }
      ]),
      { Alice: 24.5, Bob: -24.5, Davide: 0 }
    );

    assert(
      'Settlement larger than the debt flips the balance',
      computeBalances(members, [ex('Alice', 10, ['Bob'])], [
        { from: 'Bob', to: 'Alice', amount: 50 }
      ]),
      { Alice: -40, Bob: 40, Davide: 0 }
    );



    // ── Render ────────────────────────────────────────────────────────────────

    const output = document.getElementById('output');
    const summary = document.getElementById('summary');

    const groups = {};
    results.forEach(r => { (groups[r.group] = groups[r.group] || []).push(r); });

    for (const [fn, tests] of Object.entries(groups)) {
      const h2 = document.createElement('h2');
      h2.textContent = fn.includes(' ') ? fn : fn + '()';
      output.appendChild(h2);

      for (const { label, pass, actual, expected } of tests) {
        const div = document.createElement('div');
        div.className = 'result ' + (pass ? 'pass' : 'fail');
        div.textContent = (pass ? '✓' : '✗') + '  ' + label;
        if (!pass) {
          div.textContent += `\n    expected: ${JSON.stringify(expected)}\n    actual:   ${JSON.stringify(actual)}`;
          div.style.whiteSpace = 'pre';
        }
        output.appendChild(div);
      }
    }

    const total = results.length;
    const passed = results.filter(r => r.pass).length;
    summary.textContent = `${passed} / ${total} tests passed`;
    summary.className = passed === total ? 'all-pass' : 'has-fail';
  </script>
</body>
</html>
