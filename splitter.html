<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --kraft: #cfc3b0;
      --paper: #fffdf7;
      --ink: #2a2520;
      --muted: #6b6359;      /* 5.6:1 on paper */
      --muted-kraft: #4a4238; /* 6.3:1 on kraft */
      --pos: #1b6b45;
      --neg: #b3261e;
      --line: #b9ad98;
      --mono: ui-monospace, 'SF Mono', 'DejaVu Sans Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    html { background: var(--kraft); }
    body {
      font-family: var(--mono);
      background: var(--kraft);
      color: var(--ink);
      min-height: 100vh;
      font-size: 1rem;
      line-height: 1.35;
    }

    button { font-family: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
      box-shadow: 0 0 0 5px var(--paper);
    }
    h1, h2, h3 { font-weight: 700; }
    :focus:not(:focus-visible) { outline: none; }
    h2[tabindex="-1"]:focus-visible { outline: none; box-shadow: none; }

    .screen { max-width: 460px; margin: 0 auto; padding: 20px 16px 120px; }
    .screen:focus { outline: none; }

    /* ── Receipt ── */
    .receipt-wrap { filter: drop-shadow(0 3px 5px rgba(42,37,32,0.28)); }
    .receipt {
      background: var(--paper);
      padding: 22px 18px 26px;
      position: relative;
    }
    .receipt::after {
      content: '';
      position: absolute; left: 0; right: 0; top: 100%; height: 8px;
      background:
        linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0 / 12px 8px,
        linear-gradient(225deg, var(--paper) 50%, transparent 50%) 0 0 / 12px 8px;
      background-repeat: repeat-x;
    }
    .masthead { text-align: center; padding-bottom: 12px; }
    .masthead h1 { font-size: 1.35rem; letter-spacing: 0.4em; padding-left: 0.4em; }
    .friends-link {
      background: none; border: none; font-size: 0.85rem; color: var(--muted);
      padding: 10px 12px; margin-top: 2px; min-height: 44px; text-decoration: underline;
      text-decoration-style: dotted; text-underline-offset: 3px;
    }
    hr.dash { border: none; border-top: 1px dashed var(--muted); margin: 12px 0; }

    .row { display: flex; align-items: baseline; gap: 6px; }
    .row .fill { flex: 1; border-bottom: 1px dotted var(--line); transform: translateY(-3px); min-width: 12px; }
    .row .name { overflow-wrap: anywhere; min-width: 0; }
    .row .amt { white-space: nowrap; font-variant-numeric: tabular-nums; }

    .item { padding: 6px 0; }
    .item .sub { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
    .item .main { flex: 1; min-width: 0; display: block; }
    .item-line { display: flex; align-items: flex-start; gap: 2px; }
    .del {
      background: none; border: none; color: var(--muted); font-size: 0.8rem;
      min-width: 36px; min-height: 36px; margin: -4px -8px -4px 0; flex-shrink: 0;
    }
    .del:hover { color: var(--neg); }

    .total { font-size: 1.5rem; font-weight: 700; }
    .screen .sect-title { font-size: 0.78rem; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 6px; }
    .pos { color: var(--pos); font-weight: 700; }
    .neg { color: var(--neg); font-weight: 700; }
    .zero { color: var(--muted); }
    .bal { padding: 2px 0; }

    .settle { padding: 4px 0; }
    .settle .who { overflow-wrap: anywhere; min-width: 0; }
    .paid-btn {
      background: var(--paper); border: 1.5px solid var(--ink); border-radius: 2px;
      font-size: 0.72rem; font-weight: 700; padding: 0 8px; min-height: 36px; letter-spacing: 0.04em;
      flex-shrink: 0; align-self: center;
    }
    .paid-btn:active { background: var(--ink); color: var(--paper); }
    .done .who { color: var(--muted); }

    .empty-receipt { text-align: center; padding: 18px 4px 6px; color: var(--muted); }
    .empty-receipt strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 6px; }
    .link-btn {
      background: none; border: none; text-decoration: underline; text-underline-offset: 3px;
      font-size: 0.85rem; color: var(--muted-kraft); padding: 12px; min-height: 44px;
    }
    .reset-row { text-align: center; margin-top: 18px; }

    /* ── Bottom bar ── */
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, transparent, var(--kraft) 30%);
    }
    .bar-inner { max-width: 460px; margin: 0 auto; display: flex; gap: 10px; }
    .btn {
      flex: 1; min-height: 52px; border: 2px solid var(--ink); border-radius: 3px;
      font-size: 1rem; font-weight: 700; padding: 0 14px;
    }
    .btn.solid { background: var(--ink); color: var(--paper); }
    .btn.line { background: var(--paper); color: var(--ink); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn.solid:focus-visible { box-shadow: 0 0 0 5px var(--kraft); }

    /* ── Messages ── */
    .error { color: var(--neg); font-size: 0.85rem; min-height: 1.2em; margin-top: 6px; font-weight: 700; }
    .on-kraft.error { color: #8a1c15; }
    #storage-error:empty { position: absolute; }
    #storage-error { max-width: 460px; margin: 0 auto; padding: 8px 16px 0; color: #8a1c15; font-weight: 700; font-size: 0.85rem; }
    #toast {
      position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); z-index: 20;
      background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 3px;
      font-size: 0.9rem; max-width: 90vw; text-align: center;
    }
    #toast:empty { display: none; }

    /* ── Sub screens (friends, add item) ── */
    .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .back {
      background: none; border: 2px solid var(--ink); border-radius: 3px; min-height: 44px; min-width: 44px;
      font-size: 1.1rem; font-weight: 700;
    }
    .screen h2 { font-size: 1.3rem; }
    .panel { background: var(--paper); padding: 16px; border-radius: 3px; box-shadow: 0 2px 4px rgba(42,37,32,0.25); }
    .field label, .lbl { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%; font: inherit; font-size: 1rem; padding: 11px 12px; min-height: 48px;
      border: 2px solid var(--ink); border-radius: 3px; background: #fff; color: var(--ink);
    }
    .add-row { display: flex; gap: 8px; }
    .add-row .btn { flex: 0 0 auto; }
    .friend { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--line); }
    .friend span { flex: 1; overflow-wrap: anywhere; }
    .friend:last-child { border-bottom: none; }
    .del.big { font-size: 1rem; min-width: 44px; min-height: 44px; margin: 0; }
    .del:disabled { opacity: 0.35; cursor: default; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }

    /* Add item flow */
    .progress { display: flex; gap: 6px; margin: 4px 0 16px; }
    .progress i { flex: 1; height: 5px; background: var(--line); }
    .progress i.on { background: var(--ink); }
    .step-title { font-size: 1.5rem; margin: 2px 0 10px; }
    .step-sub { font-size: 0.85rem; color: var(--muted-kraft); }
    .big-amount {
      text-align: center; font-size: clamp(2.4rem, 13vw, 3.4rem); font-weight: 700;
      padding: 14px 0 4px; overflow-wrap: anywhere; line-height: 1.1;
    }
    .each { text-align: center; font-size: 0.9rem; color: var(--muted-kraft); min-height: 1.3em; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .key {
      background: var(--paper); border: 1.5px solid var(--line); border-radius: 3px;
      min-height: 54px; font-size: 1.5rem; font-weight: 700;
    }
    .key:active { background: var(--ink); color: var(--paper); }
    .choices { display: grid; gap: 8px; margin-top: 12px; }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .choice span {
      display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px;
      background: var(--paper); border: 2px solid var(--line); border-radius: 3px; font-weight: 700;
      overflow-wrap: anywhere;
    }
    .choice span::before {
      content: ''; width: 18px; height: 18px; flex-shrink: 0; border: 2px solid var(--ink); background: #fff;
    }
    .choice input[type="radio"] + span::before { border-radius: 50%; }
    .choice input:checked + span { border-color: var(--ink); background: #fff; }
    .choice input:checked + span::before { background: var(--ink); box-shadow: inset 0 0 0 3px #fff; }
    .choice input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 2px; }
    .flow-actions { display: flex; gap: 10px; margin-top: 16px; }

    /* Pay confirmation */
    .overlay {
      position: fixed; inset: 0; z-index: 30; background: rgba(42,37,32,0.6);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .overlay[hidden] { display: none; }
    .slip {
      background: var(--paper); width: 100%; max-width: 380px; padding: 18px 16px; border-radius: 3px;
      box-shadow: 0 4px 12px rgba(42,37,32,0.4);
    }
    .slip h2 { font-size: 0.78rem; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 6px; }
    .slip .who { font-size: 1.2rem; font-weight: 700; overflow-wrap: anywhere; margin-bottom: 10px; }
    .slip input[type="text"] { text-align: right; }
    .slip .error { min-height: 1.2em; }
    .slip .flow-actions .btn { min-width: 0; }

    @media (min-width: 600px) {
      .screen { padding-top: 40px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .paid-btn, .btn, .key { transition: background 0.1s, color 0.1s; }
    }
  </style>
</head>
<body>
  <div id="storage-error" role="alert"></div>

  <!-- HOME: the receipt -->
  <main id="view-home" class="screen" tabindex="-1" aria-label="Splitter receipt">
    <div class="receipt-wrap">
      <div class="receipt">
        <div class="masthead">
          <h1>SPLITTER</h1>
          <button class="friends-link" id="friends-btn"></button>
        </div>
        <div id="receipt-body"></div>
      </div>
    </div>
    <div class="reset-row"><button class="link-btn" id="reset-btn">Reset everything</button></div>
  </main>

  <div class="bar" id="home-bar">
    <div class="bar-inner">
      <button class="btn solid" id="add-btn">+ Add item</button>
      <button class="btn line" id="share-btn">Share</button>
    </div>
  </div>

  <!-- FRIENDS -->
  <section id="view-friends" class="screen" hidden aria-labelledby="friends-title">
    <div class="topbar">
      <button class="back" id="friends-back" aria-label="Back to receipt">&larr;</button>
      <h2 id="friends-title" tabindex="-1">Friends</h2>
    </div>
    <div class="panel">
      <div class="field">
        <label for="member-input">Add a friend</label>
        <div class="add-row">
          <input type="text" id="member-input" placeholder="Name" maxlength="40" autocomplete="off">
          <button class="btn solid" id="member-add-btn">Add</button>
        </div>
      </div>
      <div class="error" id="member-error" role="alert"></div>
      <div id="member-list" style="margin-top:8px"></div>
      <p class="hint">Friends who appear in an expense or payment cannot be removed.</p>
    </div>
  </section>

  <!-- ADD ITEM -->
  <section id="view-add" class="screen" hidden aria-labelledby="add-title">
    <div class="topbar">
      <button class="back" id="add-back" aria-label="Back">&larr;</button>
      <p class="step-sub" id="add-step-label"></p>
    </div>
    <div class="progress" aria-hidden="true"><i></i><i></i><i></i></div>
    <h2 class="step-title" id="add-title" tabindex="-1"></h2>

    <div id="step-1">
      <div class="field">
        <label for="exp-desc">Description</label>
        <input type="text" id="exp-desc" placeholder="e.g. Dinner" maxlength="80" autocomplete="off">
      </div>
      <div class="big-amount" id="amount-display" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="keypad" role="group" aria-label="Amount keypad" id="keypad"></div>
    </div>

    <div id="step-2" hidden>
      <div class="choices" id="paid-choices" role="radiogroup" aria-labelledby="add-title"></div>
    </div>

    <div id="step-3" hidden>
      <div class="each" id="each-line" role="status" aria-live="polite" style="font-size:1rem;font-weight:700;color:var(--ink);margin-bottom:4px"></div>
      <div class="choices" id="part-choices" role="group" aria-labelledby="add-title"></div>
    </div>

    <div class="error on-kraft" id="exp-error" role="alert"></div>
    <div class="flow-actions"><button class="btn solid" id="next-btn"></button></div>
  </section>

  <div class="overlay" id="pay-overlay" hidden>
    <div class="slip" role="dialog" aria-modal="true" aria-labelledby="pay-title" aria-describedby="pay-who">
      <h2 id="pay-title">CONFIRM PAYMENT</h2>
      <div class="who" id="pay-who"></div>
      <div class="field">
        <label for="pay-amount">Amount paid (€)</label>
        <input type="text" id="pay-amount" inputmode="decimal" autocomplete="off" aria-describedby="pay-error">
      </div>
      <div class="error" id="pay-error" role="alert"></div>
      <div class="flow-actions">
        <button class="btn line" id="pay-cancel">Cancel</button>
        <button class="btn solid" id="pay-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const MAX_AMOUNT = 1e9;

    function round2(x) { return Math.round(x * 100) / 100; }

    function toCents(x) { return Math.round(x * 100); }

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

    function validAmount(x) { return typeof x === 'number' && Number.isFinite(x) && x > 0 && x <= MAX_AMOUNT; }

    /**
     * Compute the net balance for each member.
     * Positive = is owed money. Negative = owes money.
     * Entries that cannot be applied (invalid amount, no participants, people who
     * are not members) are ignored instead of corrupting the balances.
     *
     * Works in whole cents so the balances always add up to exactly zero.
     * When an expense does not divide evenly, the leftover cents go one each to
     * the participants, starting from the payer (if they take part).
     */
    function computeBalances(members, expenses, settlements) {
      const cents = Object.create(null);
      for (const m of members) cents[m] = 0;
      const known = name => Object.prototype.hasOwnProperty.call(cents, name);

      for (const expense of expenses) {
        const { amount, paidBy, participants } = expense;
        if (!validAmount(amount) || !Array.isArray(participants) || participants.length === 0) continue;
        if (!known(paidBy) || !participants.every(known)) continue;

        const total = toCents(amount);
        const order = participants.slice();
        const payerAt = order.indexOf(paidBy);
        if (payerAt > 0) order.unshift(order.splice(payerAt, 1)[0]);

        const base = Math.floor(total / order.length);
        const extra = total - base * order.length;

        cents[paidBy] += total;
        order.forEach((p, i) => { cents[p] -= base + (i < extra ? 1 : 0); });
      }

      for (const s of settlements) {
        if (!validAmount(s.amount) || !known(s.from) || !known(s.to)) continue;
        const c = toCents(s.amount);
        cents[s.from] += c;
        cents[s.to] -= c;
      }

      const balances = Object.create(null);
      for (const m of members) balances[m] = cents[m] / 100;

      return balances;
    }

    /**
     * Produce a short list of transactions that settles all debts
     * (greedy: largest debtor pays largest creditor; the fewest possible
     * transactions is not guaranteed).
     */
    function simplifyDebts(balances) {
      const creditors = [];
      const debtors = [];

      for (const [name, balance] of Object.entries(balances)) {
        if (!Number.isFinite(balance)) continue;
        const c = toCents(balance);
        if (c > 0)      creditors.push({ name, amount: c });
        else if (c < 0) debtors.push({ name, amount: -c });
      }

      creditors.sort((a, b) => b.amount - a.amount);
      debtors.sort((a, b) => b.amount - a.amount);

      const transactions = [];
      let di = 0, ci = 0;

      while (di < debtors.length && ci < creditors.length) {
        const amount = Math.min(debtors[di].amount, creditors[ci].amount);
        if (!(amount > 0)) break;
        transactions.push({ from: debtors[di].name, to: creditors[ci].name, amount: amount / 100 });
        debtors[di].amount -= amount;
        creditors[ci].amount -= amount;
        if (debtors[di].amount === 0) di++;
        if (creditors[ci].amount === 0) ci++;
      }

      return transactions;
    }

    /**
     * Turn whatever was read from storage into a safe state object.
     * Keeps the stored format; drops entries that would break the app.
     */
    function sanitizeState(raw) {
      const out = { members: [], expenses: [], settlements: [] };
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;

      const isName = x => typeof x === 'string' && x.length > 0;
      if (Array.isArray(raw.members)) {
        for (const m of raw.members) if (isName(m) && !out.members.includes(m)) out.members.push(m);
      }
      const has = name => out.members.includes(name);
      const text = x => typeof x === 'string' ? x : '';

      if (Array.isArray(raw.expenses)) {
        for (const e of raw.expenses) {
          if (!e || typeof e !== 'object' || !validAmount(e.amount)) continue;
          if (!has(e.paidBy) || !Array.isArray(e.participants) || e.participants.length === 0) continue;
          if (!e.participants.every(has)) continue;
          out.expenses.push({
            id: text(e.id) || uid(), description: text(e.description), amount: e.amount,
            paidBy: e.paidBy, participants: e.participants.slice(), date: text(e.date),
          });
        }
      }

      if (Array.isArray(raw.settlements)) {
        for (const s of raw.settlements) {
          if (!s || typeof s !== 'object' || !validAmount(s.amount) || !has(s.from) || !has(s.to)) continue;
          out.settlements.push({
            id: text(s.id) || uid(), from: s.from, to: s.to, amount: s.amount, date: text(s.date),
          });
        }
      }

      return out;
    }
  </script>
  <script>

    // ── Storage ───────────────────────────────────────────────────────────────

    const STORAGE_KEY = 'splitter';

    function load() {
      try { return sanitizeState(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
      catch { return defaultState(); }
    }

    function save(s) {
      const err = document.getElementById('storage-error');
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        err.textContent = '';
      } catch {
        err.textContent = 'Could not save your data in this browser: changes will be lost on reload.';
      }
    }

    function defaultState() { return { members: [], expenses: [], settlements: [] }; }

    // ── State ─────────────────────────────────────────────────────────────────

    let state = load();
    // Add-item flow: step 1..3, amount typed as a string on the keypad
    let flow = null;
    let lastOpener = null;

    // ── Helpers ───────────────────────────────────────────────────────────────

    const $ = id => document.getElementById(id);
    function num(n) { return n.toFixed(2); }
    function fmt(n) { return '€' + num(n); }
    function signed(n) { return (n > 0 ? '+' : n < 0 ? '-' : '') + num(Math.abs(n)); }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Today's date in the user's local time zone, as YYYY-MM-DD
    function today() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    // Parses an amount field: returns a number rounded to cents, or null if unusable.
    function parseAmount(raw) {
      const n = round2(parseFloat(raw));
      return validAmount(n) ? n : null;
    }

    function setError(id, msg) { $(id).textContent = msg; }
    function clearError(id)    { $(id).textContent = ''; }

    let toastTimer = null;
    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.textContent = ''; }, 3500);
    }

    // ── Views ─────────────────────────────────────────────────────────────────

    const VIEWS = ['home', 'friends', 'add'];

    function showView(name) {
      for (const v of VIEWS) $('view-' + v).hidden = v !== name;
      $('home-bar').hidden = name !== 'home';
      window.scrollTo(0, 0);
      const target = name === 'home' ? $('view-home') : name === 'friends' ? $('friends-title') : $('add-title');
      target.focus({ preventScroll: true });
    }

    function backHome() {
      flow = null;
      renderAll();
      showView('home');
      if (lastOpener && document.body.contains(lastOpener) && !lastOpener.disabled) lastOpener.focus({ preventScroll: true });
      lastOpener = null;
    }

    // ── Render: Receipt ───────────────────────────────────────────────────────

    function line(name, amount, cls) {
      return `<div class="row"><span class="name">${name}</span><span class="fill" aria-hidden="true"></span><span class="amt ${cls || ''}">${amount}</span></div>`;
    }

    function renderAll() {
      const n = state.members.length;
      const fb = $('friends-btn');
      fb.textContent = n === 0 ? 'Add friends' : n + (n === 1 ? ' friend' : ' friends');
      fb.setAttribute('aria-label', n === 0 ? 'Add friends' : `${n} ${n === 1 ? 'friend' : 'friends'}, manage friends`);
      $('share-btn').disabled = n === 0;

      const body = $('receipt-body');
      if (n === 0) {
        body.innerHTML = `<hr class="dash"><div class="empty-receipt"><strong>No friends yet</strong>Add the people you split with to start the receipt.</div>`;
        return;
      }

      let html = '<hr class="dash">';
      if (state.expenses.length === 0) {
        html += '<div class="empty-receipt">No items yet. Tap “+ Add item”.</div>';
      }
      for (let i = 0; i < state.expenses.length; i++) {
        const e = state.expenses[i];
        const who = e.participants.length === n ? 'split ' + n : e.participants.map(escHtml).join(', ');
        html += `<div class="item"><div class="item-line"><span class="main">
          ${line(escHtml(e.description || 'Item'), num(e.amount))}
          <div class="sub">${escHtml(e.paidBy)} &middot; ${who}</div></span>
          <button class="del" data-del-exp="${escHtml(e.id)}" aria-label="Delete expense ${escHtml(e.description)}">✕</button></div></div>`;
      }

      const totalCents = state.expenses.reduce((s, e) => s + toCents(e.amount), 0);
      html += `<hr class="dash"><div class="row total"><span>TOTAL</span><span class="fill" aria-hidden="true" style="border:none"></span><span>${fmt(totalCents / 100)}</span></div><hr class="dash">`;

      const balances = computeBalances(state.members, state.expenses, state.settlements);
      html += '<h2 class="sect-title">BALANCES</h2>';
      for (const [name, bal] of Object.entries(balances)) {
        const cls = bal > 0 ? 'pos' : bal < 0 ? 'neg' : 'zero';
        const word = bal > 0 ? ', gets back ' + num(bal) : bal < 0 ? ', owes ' + num(-bal) : ', settled up';
        html += `<div class="bal">${line(escHtml(name), `<span aria-hidden="true">${signed(bal)}</span><span class="sr-only" style="position:absolute;left:-9999px">${word.slice(2)}</span>`, cls)}</div>`;
      }

      const txs = simplifyDebts(balances);
      if (txs.length) {
        html += '<hr class="dash"><h2 class="sect-title">TO SETTLE</h2>';
        txs.forEach((t, i) => {
          html += `<div class="row settle"><span class="who">${escHtml(t.from)} &gt; ${escHtml(t.to)}</span><span class="fill" aria-hidden="true"></span><span class="amt">${num(t.amount)}</span>
            <button class="paid-btn" data-paid="${i}" data-from="${escHtml(t.from)}" data-to="${escHtml(t.to)}" aria-label="Paid: ${escHtml(t.from)} pays ${escHtml(t.to)} ${num(t.amount)}">PAID?</button></div>`;
        });
      }

      if (state.settlements.length) {
        html += '<hr class="dash"><h2 class="sect-title">PAID</h2>';
        for (let i = state.settlements.length - 1; i >= 0; i--) {
          const s = state.settlements[i];
          html += `<div class="item-line done"><span class="main">${line(`<span class="who">${escHtml(s.from)} &gt; ${escHtml(s.to)}</span>`, num(s.amount))}</span>
            <button class="del" data-del-set="${escHtml(s.id)}" aria-label="Delete payment from ${escHtml(s.from)} to ${escHtml(s.to)}">✕</button></div>`;
        }
      }

      body.innerHTML = html;
      body.querySelectorAll('[data-del-exp]').forEach(b => b.addEventListener('click', () => deleteEntry('expenses', b.dataset.delExp)));
      body.querySelectorAll('[data-del-set]').forEach(b => b.addEventListener('click', () => deleteEntry('settlements', b.dataset.delSet)));
      body.querySelectorAll('[data-paid]').forEach(b => b.addEventListener('click', () => openPay(txs[+b.dataset.paid], b)));
    }

    function deleteEntry(key, id) {
      state[key] = state[key].filter(e => e.id !== id);
      save(state);
      renderAll();
      $('view-home').focus({ preventScroll: true });
      toast('Deleted');
    }

    let payTx = null;
    let payOpener = null;

    function openPay(tx, opener) {
      if (payTx) return;
      payTx = tx;
      payOpener = opener;
      $('pay-who').textContent = `${tx.from} > ${tx.to}`;
      $('pay-amount').value = num(tx.amount);
      clearError('pay-error');
      $('pay-overlay').hidden = false;
      $('pay-amount').focus();
      $('pay-amount').select();
    }

    function closePay() {
      const tx = payTx, opener = payOpener;
      payTx = null;
      payOpener = null;
      $('pay-overlay').hidden = true;
      if (opener && document.body.contains(opener)) { opener.focus({ preventScroll: true }); return; }
      const again = tx && Array.from(document.querySelectorAll('[data-paid]'))
        .find(b => b.dataset.from === tx.from && b.dataset.to === tx.to);
      (again || $('view-home')).focus({ preventScroll: true });
    }

    function confirmPay() {
      if (!payTx) return;
      const raw = $('pay-amount').value.trim().replace(',', '.');
      const amount = /^\d+(\.\d{1,2})?$/.test(raw) ? parseAmount(raw) : null;
      if (amount === null) {
        setError('pay-error', 'Enter an amount above 0 with at most 2 decimals.');
        $('pay-amount').focus();
        return;
      }
      const tx = payTx;
      state.settlements.push({ id: uid(), from: tx.from, to: tx.to, amount, date: today() });
      save(state);
      renderAll();
      closePay();
      toast(`${tx.from} paid ${tx.to} ${num(amount)}`);
    }

    // ── Friends ───────────────────────────────────────────────────────────────

    function renderFriends() {
      const list = $('member-list');
      if (state.members.length === 0) { list.innerHTML = '<p class="hint">No friends yet.</p>'; return; }

      const used = new Set();
      for (const e of state.expenses) { used.add(e.paidBy); for (const p of e.participants) used.add(p); }
      for (const s of state.settlements) { used.add(s.from); used.add(s.to); }

      list.innerHTML = '';
      for (const name of state.members) {
        const isUsed = used.has(name);
        const row = document.createElement('div');
        row.className = 'friend';
        row.innerHTML = `<span>${escHtml(name)}</span><button class="del big" ${isUsed ? 'disabled' : ''}
          aria-label="${isUsed ? 'Cannot remove ' + escHtml(name) + ' (in use)' : 'Remove ' + escHtml(name)}">✕</button>`;
        row.querySelector('button').addEventListener('click', () => {
          state.members = state.members.filter(m => m !== name);
          save(state);
          renderFriends();
          $('member-input').focus();
        });
        list.appendChild(row);
      }
    }

    function addMember() {
      clearError('member-error');
      const input = $('member-input');
      const name = input.value.trim().replace(/\s+/g, ' ');
      if (!name) return;
      if (state.members.includes(name)) {
        setError('member-error', `"${name}" is already in the group.`);
        return;
      }
      state.members.push(name);
      save(state);
      input.value = '';
      renderFriends();
      input.focus();
    }

    function openFriends(opener) {
      lastOpener = opener;
      clearError('member-error');
      renderFriends();
      showView('friends');
    }

    // ── Add item flow ─────────────────────────────────────────────────────────

    const STEP_TITLES = ['How much was it?', 'Who paid?', 'Split between'];
    const NEXT_LABELS = ['Next: who paid?', 'Next: split between', 'Add item'];

    function openAdd(opener) {
      if (state.members.length === 0) { openFriends(opener); return; }
      lastOpener = opener;
      flow = { step: 1, desc: '', amt: '', paidBy: state.members[0], parts: new Set(state.members) };
      $('exp-desc').value = '';
      clearError('exp-error');
      renderKeypad();
      renderFlow();
      showView('add');
    }

    function renderKeypad() {
      const keys = ['1','2','3','4','5','6','7','8','9','.','0','⌫'];
      const pad = $('keypad');
      pad.innerHTML = '';
      for (const k of keys) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'key';
        b.textContent = k;
        b.setAttribute('aria-label', k === '.' ? 'Decimal point' : k === '⌫' ? 'Delete last digit' : k);
        b.addEventListener('click', () => pressKey(k));
        pad.appendChild(b);
      }
    }

    function pressKey(k) {
      if (!flow) return;
      let a = flow.amt;
      if (k === '⌫') a = a.slice(0, -1);
      else if (k === '.') { if (!a.includes('.')) a = (a || '0') + '.'; }
      else {
        const [int, dec] = a.split('.');
        if (dec !== undefined ? dec.length >= 2 : int.length >= 10) return;
        a = a === '0' ? k : a + k;
      }
      flow.amt = a;
      clearError('exp-error');
      renderAmount();
    }

    function renderAmount() {
      $('amount-display').textContent = '€' + (flow.amt || '0');
    }

    function eachText() {
      const n = flow.parts.size;
      const amount = parseAmount(flow.amt);
      if (n === 0) return 'Pick at least one person';
      const each = amount === null ? 0 : amount / n;
      const even = amount !== null && toCents(amount) % n === 0;
      return `${n} ${n === 1 ? 'person' : 'people'} · ${even ? '' : '≈ '}${num(each)} each`;
    }

    function renderFlow() {
      const s = flow.step;
      document.querySelectorAll('.progress i').forEach((el, i) => el.classList.toggle('on', i < s));
      $('add-step-label').textContent = `Step ${s} of 3`;
      $('add-title').textContent = STEP_TITLES[s - 1];
      $('next-btn').textContent = NEXT_LABELS[s - 1];
      $('step-1').hidden = s !== 1;
      $('step-2').hidden = s !== 2;
      $('step-3').hidden = s !== 3;
      clearError('exp-error');

      if (s === 1) renderAmount();

      if (s === 2) {
        const box = $('paid-choices');
        box.innerHTML = '';
        for (const m of state.members) {
          const l = document.createElement('label');
          l.className = 'choice';
          l.innerHTML = `<input type="radio" name="paid" value="${escHtml(m)}" ${m === flow.paidBy ? 'checked' : ''}><span>${escHtml(m)}</span>`;
          l.querySelector('input').addEventListener('change', () => { flow.paidBy = m; });
          box.appendChild(l);
        }
      }

      if (s === 3) {
        const box = $('part-choices');
        box.innerHTML = '';
        for (const m of state.members) {
          const l = document.createElement('label');
          l.className = 'choice';
          l.innerHTML = `<input type="checkbox" value="${escHtml(m)}" ${flow.parts.has(m) ? 'checked' : ''}><span>${escHtml(m)}</span>`;
          l.querySelector('input').addEventListener('change', e => {
            if (e.target.checked) flow.parts.add(m); else flow.parts.delete(m);
            $('each-line').textContent = eachText();
            clearError('exp-error');
          });
          box.appendChild(l);
        }
        $('each-line').textContent = eachText();
      }
    }

    function goStep(step) {
      flow.step = step;
      renderFlow();
      $('add-title').focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }

    function flowBack() {
      if (!flow) return;
      if (flow.step > 1) goStep(flow.step - 1); else backHome();
    }

    function flowNext() {
      if (!flow) return;
      clearError('exp-error');
      if (flow.step === 1) {
        const desc = $('exp-desc').value.trim();
        if (!desc) { setError('exp-error', 'Please enter a description.'); $('exp-desc').focus(); return; }
        if (parseAmount(flow.amt) === null) { setError('exp-error', 'Please enter a valid amount (0.01 to 1,000,000,000).'); return; }
        flow.desc = desc;
        goStep(2);
      } else if (flow.step === 2) {
        if (!flow.paidBy) { setError('exp-error', 'Please select who paid.'); return; }
        goStep(3);
      } else {
        if (flow.parts.size === 0) { setError('exp-error', 'Select at least one participant.'); return; }
        state.expenses.push({
          id: uid(),
          description: flow.desc,
          amount: parseAmount(flow.amt),
          paidBy: flow.paidBy,
          participants: state.members.filter(m => flow.parts.has(m)),
          date: today(),
        });
        save(state);
        toast('Item added');
        backHome();
      }
    }

    // ── Share ─────────────────────────────────────────────────────────────────

    function summaryText() {
      const pad = (a, b) => a + ' ' + b;
      const out = ['SPLITTER', ''];
      for (const e of state.expenses) {
        out.push(pad(e.description || 'Item', num(e.amount)) + ` (paid by ${e.paidBy}, ${e.participants.length === state.members.length ? 'split ' + e.participants.length : e.participants.join(', ')})`);
      }
      const total = state.expenses.reduce((s, e) => s + toCents(e.amount), 0) / 100;
      out.push('', 'TOTAL ' + fmt(total), '', 'BALANCES');
      const balances = computeBalances(state.members, state.expenses, state.settlements);
      for (const [name, bal] of Object.entries(balances)) out.push(`${name} ${signed(bal) || '0.00'}`);
      const txs = simplifyDebts(balances);
      if (txs.length) {
        out.push('', 'TO SETTLE');
        for (const t of txs) out.push(`${t.from} > ${t.to} ${num(t.amount)}`);
      }
      return out.join('\n');
    }

    async function share() {
      const text = summaryText();
      if (navigator.share) {
        try { await navigator.share({ title: 'Splitter', text }); return; }
        catch (err) { if (err && err.name === 'AbortError') return; /* otherwise fall back to copying */ }
      }
      try {
        await navigator.clipboard.writeText(text);
        toast('Summary copied to clipboard');
      } catch {
        toast('Could not share or copy the summary');
      }
    }

    // ── Event listeners ───────────────────────────────────────────────────────

    $('friends-btn').addEventListener('click', e => openFriends(e.currentTarget));
    $('friends-back').addEventListener('click', backHome);
    $('member-add-btn').addEventListener('click', addMember);
    $('member-input').addEventListener('keydown', e => { if (e.key === 'Enter') addMember(); });
    $('add-btn').addEventListener('click', e => openAdd(e.currentTarget));
    $('add-back').addEventListener('click', flowBack);
    $('next-btn').addEventListener('click', flowNext);
    $('exp-desc').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); flowNext(); } });
    $('share-btn').addEventListener('click', share);
    $('reset-btn').addEventListener('click', () => {
      if (confirm('Reset everything? All data will be lost.')) {
        state = defaultState();
        save(state);
        renderAll();
      }
    });

    $('pay-confirm').addEventListener('click', confirmPay);
    $('pay-cancel').addEventListener('click', closePay);
    $('pay-amount').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmPay(); } });
    $('pay-amount').addEventListener('input', () => clearError('pay-error'));

    document.addEventListener('keydown', e => {
      if (payTx) {
        if (e.key === 'Escape') closePay();
        else if (e.key === 'Tab') {
          const f = [$('pay-amount'), $('pay-cancel'), $('pay-confirm')];
          const at = f.indexOf(document.activeElement);
          const next = e.shiftKey ? (at <= 0 ? f.length - 1 : at - 1) : (at === f.length - 1 ? 0 : at + 1);
          e.preventDefault();
          f[next].focus();
        }
        return;
      }
      if (e.key === 'Escape') {
        if (!$('view-add').hidden) flowBack();
        else if (!$('view-friends').hidden) backHome();
        return;
      }
      // Physical keyboard types into the amount while step 1 is open and no text field has focus
      if (flow && flow.step === 1 && !$('view-add').hidden && !e.ctrlKey && !e.metaKey && !e.altKey
          && !(e.target instanceof HTMLInputElement) && !(e.target instanceof HTMLButtonElement && e.key === 'Enter')) {
        if (/^[0-9]$/.test(e.key)) pressKey(e.key);
        else if (e.key === '.' || e.key === ',') pressKey('.');
        else if (e.key === 'Backspace') pressKey('⌫');
      }
    });

    // ── Init ──────────────────────────────────────────────────────────────────

    renderAll();
    showView('home');
    document.activeElement && document.activeElement.blur();
  </script>
</body>
</html>
