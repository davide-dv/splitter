<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #3d5a99;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Card ── */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b6b6b;
      margin-bottom: 16px;
    }

    /* ── Members ── */
    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      min-height: 8px;
    }

    .member-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #eef1fb;
      border-radius: 20px;
      padding: 5px 10px 5px 14px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #3d5a99;
    }

    .member-tag button {
      background: none;
      border: none;
      cursor: pointer;
      color: #5c6590;
      font-size: 0.85rem;
      padding: 0 2px;
      line-height: 1;
      border-radius: 50%;
      transition: color 0.15s;
    }

    .member-tag button:hover:not(:disabled) { color: #e53935; }
    .member-tag button:disabled { cursor: default; opacity: 0.4; }

    /* ── Inputs & selects ── */
    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"],
    input[type="number"],
    select {
      border: 1.5px solid #949494;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 1rem;
      width: 100%;
      color: #1a1a2e;
      background: white;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input:focus, select:focus { border-color: #3d5a99; }

    /* Visible keyboard focus on every interactive element */
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid #3d5a99;
      outline-offset: 2px;
    }

    /* ── Buttons ── */
    button.primary {
      background: #3d5a99;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      font-family: inherit;
    }

    button.primary:hover { background: #2e4480; }

    button.small {
      background: #3d5a99;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.15s;
    }

    button.small:hover { background: #2e4480; }

    button.icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #6b6b6b;
      font-size: 0.85rem;
      padding: 4px 6px;
      border-radius: 4px;
      transition: color 0.15s;
      font-family: inherit;
      flex-shrink: 0;
    }

    button.icon-btn:hover { color: #e53935; }

    button.danger {
      background: none;
      border: 1.5px solid #949494;
      color: #6b6b6b;
      border-radius: 8px;
      padding: 7px 18px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    button.danger:hover { border-color: #e53935; color: #e53935; }

    /* ── Form layout ── */
    .form-grid { display: grid; gap: 12px; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    @media (max-width: 480px) {
      .two-col, .three-col { grid-template-columns: 1fr; }
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #666;
      margin-bottom: 5px;
      display: block;
    }

    /* ── Checkboxes ── */
    .checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.88rem;
      cursor: pointer;
      color: #444;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] { cursor: pointer; width: auto; }

    /* ── Expense list ── */
    .expense-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid #f2f2f2;
    }

    .expense-item:last-child { border-bottom: none; }

    .expense-meta { flex: 1; min-width: 0; }

    .expense-desc {
      font-weight: 600;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .expense-sub {
      font-size: 0.78rem;
      color: #6b6b6b;
      margin-top: 2px;
    }

    .expense-amount {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      color: #1a1a2e;
    }

    /* ── Balances ── */
    .balance-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #f2f2f2;
      font-size: 0.92rem;
    }

    .balance-item:last-child { border-bottom: none; }
    .balance-name { font-weight: 500; }
    .positive { color: #2e7d32; font-weight: 700; }
    .negative { color: #c62828; font-weight: 700; }
    .zero { color: #6b6b6b; }

    /* ── Suggested settlements ── */
    .transactions {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #f2f2f2;
    }

    .transactions h3 {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b6b6b;
      margin-bottom: 12px;
    }

    .transaction-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: #f8f9fd;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    .transaction-item:last-child { margin-bottom: 0; }
    .transaction-text { flex: 1; }
    .transaction-text strong { color: #3d5a99; }
    .transaction-amount { font-weight: 700; }

    /* ── Settlements list ── */
    .settlement-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #f2f2f2;
      font-size: 0.88rem;
    }

    .settlement-item:last-child { border-bottom: none; }
    .settlement-text { flex: 1; color: #555; }
    .settlement-text strong { color: #1a1a2e; }
    .settlement-amount { font-weight: 700; white-space: nowrap; }

    /* ── Misc ── */
    .empty {
      text-align: center;
      color: #6b6b6b;
      font-size: 0.88rem;
      padding: 16px 0;
    }

    .error {
      color: #c62828;
      font-size: 0.8rem;
      min-height: 18px;
      margin-top: 6px;
    }

    .reset-row {
      display: flex;
      justify-content: center;
      padding-top: 4px;
    }

    .divider {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Splitter</h1>
  <div class="container">
    <div class="error" id="storage-error" role="alert"></div>

    <!-- Friends -->
    <div class="card">
      <h2>Friends</h2>
      <div id="member-list" class="member-list"></div>
      <div class="input-row">
        <input type="text" id="member-input" placeholder="Add a name…" maxlength="40" autocomplete="off">
        <button class="primary" id="member-add-btn">Add</button>
      </div>
      <div class="error" id="member-error" role="alert"></div>
    </div>

    <!-- Add Expense -->
    <div class="card">
      <h2>Add Expense</h2>
      <div class="form-grid">
        <div>
          <label class="form-label" for="exp-desc">Description</label>
          <input type="text" id="exp-desc" placeholder="e.g. Dinner" maxlength="80" autocomplete="off">
        </div>
        <div class="two-col">
          <div>
            <label class="form-label" for="exp-amount">Amount (€)</label>
            <input type="number" id="exp-amount" placeholder="0.00" min="0.01" step="0.01">
          </div>
          <div>
            <label class="form-label" for="exp-paid-by">Paid by</label>
            <select id="exp-paid-by"></select>
          </div>
        </div>
        <div>
          <span class="form-label" id="exp-participants-label">Split between</span>
          <div class="checkboxes" id="exp-participants" role="group" aria-labelledby="exp-participants-label"></div>
        </div>
        <button class="primary" id="exp-add-btn">Add Expense</button>
      </div>
      <div class="error" id="exp-error" role="alert"></div>
    </div>

    <!-- Expenses -->
    <div class="card">
      <h2>Expenses</h2>
      <div id="expense-list"></div>
    </div>

    <!-- Balances -->
    <div class="card">
      <h2>Balances</h2>
      <div id="balance-list"></div>
      <div class="transactions" id="transactions-section" style="display:none">
        <h3>Suggested settlements</h3>
        <div id="transaction-list"></div>
      </div>
    </div>

    <!-- Record a settlement -->
    <div class="card">
      <h2>Record a Settlement</h2>
      <div class="form-grid">
        <div class="three-col">
          <div>
            <label class="form-label" for="set-from">From</label>
            <select id="set-from"></select>
          </div>
          <div>
            <label class="form-label" for="set-to">To</label>
            <select id="set-to"></select>
          </div>
          <div>
            <label class="form-label" for="set-amount">Amount (€)</label>
            <input type="number" id="set-amount" placeholder="0.00" min="0.01" step="0.01">
          </div>
        </div>
        <button class="primary" id="set-add-btn">Record Settlement</button>
      </div>
      <div class="error" id="set-error" role="alert"></div>
      <div id="settlement-list" class="divider" style="display:none"></div>
    </div>

    <!-- Reset -->
    <div class="reset-row">
      <button class="danger" id="reset-btn">Reset everything</button>
    </div>

  </div>

  <script>
    const MAX_AMOUNT = 1e9;

    function round2(x) { return Math.round(x * 100) / 100; }

    function toCents(x) { return Math.round(x * 100); }

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

    function validAmount(x) { return typeof x === 'number' && Number.isFinite(x) && x > 0 && x <= MAX_AMOUNT; }

    /**
     * Compute the net balance for each member.
     * Positive = is owed money. Negative = owes money.
     * Entries that cannot be applied (invalid amount, no participants, people who
     * are not members) are ignored instead of corrupting the balances.
     *
     * Works in whole cents so the balances always add up to exactly zero.
     * When an expense does not divide evenly, the leftover cents go one each to
     * the participants, starting from the payer (if they take part).
     */
    function computeBalances(members, expenses, settlements) {
      const cents = Object.create(null);
      for (const m of members) cents[m] = 0;
      const known = name => Object.prototype.hasOwnProperty.call(cents, name);

      for (const expense of expenses) {
        const { amount, paidBy, participants } = expense;
        if (!validAmount(amount) || !Array.isArray(participants) || participants.length === 0) continue;
        if (!known(paidBy) || !participants.every(known)) continue;

        const total = toCents(amount);
        const order = participants.slice();
        const payerAt = order.indexOf(paidBy);
        if (payerAt > 0) order.unshift(order.splice(payerAt, 1)[0]);

        const base = Math.floor(total / order.length);
        const extra = total - base * order.length;

        cents[paidBy] += total;
        order.forEach((p, i) => { cents[p] -= base + (i < extra ? 1 : 0); });
      }

      for (const s of settlements) {
        if (!validAmount(s.amount) || !known(s.from) || !known(s.to)) continue;
        const c = toCents(s.amount);
        cents[s.from] += c;
        cents[s.to] -= c;
      }

      const balances = Object.create(null);
      for (const m of members) balances[m] = cents[m] / 100;

      return balances;
    }

    /**
     * Produce a short list of transactions that settles all debts
     * (greedy: largest debtor pays largest creditor).
     */
    function simplifyDebts(balances) {
      const creditors = [];
      const debtors = [];

      for (const [name, balance] of Object.entries(balances)) {
        if (!Number.isFinite(balance)) continue;
        const c = toCents(balance);
        if (c > 0)      creditors.push({ name, amount: c });
        else if (c < 0) debtors.push({ name, amount: -c });
      }

      creditors.sort((a, b) => b.amount - a.amount);
      debtors.sort((a, b) => b.amount - a.amount);

      const transactions = [];
      let di = 0, ci = 0;

      while (di < debtors.length && ci < creditors.length) {
        const amount = Math.min(debtors[di].amount, creditors[ci].amount);
        if (!(amount > 0)) break;
        transactions.push({ from: debtors[di].name, to: creditors[ci].name, amount: amount / 100 });
        debtors[di].amount -= amount;
        creditors[ci].amount -= amount;
        if (debtors[di].amount === 0) di++;
        if (creditors[ci].amount === 0) ci++;
      }

      return transactions;
    }

    /**
     * Turn whatever was read from storage into a safe state object.
     * Keeps the stored format; drops entries that would break the app.
     */
    function sanitizeState(raw) {
      const out = { members: [], expenses: [], settlements: [] };
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;

      const isName = x => typeof x === 'string' && x.length > 0;
      if (Array.isArray(raw.members)) {
        for (const m of raw.members) if (isName(m) && !out.members.includes(m)) out.members.push(m);
      }
      const has = name => out.members.includes(name);
      const text = x => typeof x === 'string' ? x : '';

      if (Array.isArray(raw.expenses)) {
        for (const e of raw.expenses) {
          if (!e || typeof e !== 'object' || !validAmount(e.amount)) continue;
          if (!has(e.paidBy) || !Array.isArray(e.participants) || e.participants.length === 0) continue;
          if (!e.participants.every(has)) continue;
          out.expenses.push({
            id: text(e.id) || uid(), description: text(e.description), amount: e.amount,
            paidBy: e.paidBy, participants: e.participants.slice(), date: text(e.date),
          });
        }
      }

      if (Array.isArray(raw.settlements)) {
        for (const s of raw.settlements) {
          if (!s || typeof s !== 'object' || !validAmount(s.amount) || !has(s.from) || !has(s.to)) continue;
          out.settlements.push({
            id: text(s.id) || uid(), from: s.from, to: s.to, amount: s.amount, date: text(s.date),
          });
        }
      }

      return out;
    }
  </script>
  <script>

    // ── Storage ───────────────────────────────────────────────────────────────

    const STORAGE_KEY = 'splitter';

    function load() {
      try { return sanitizeState(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
      catch { return defaultState(); }
    }

    function save(s) {
      const err = document.getElementById('storage-error');
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        err.textContent = '';
      } catch {
        err.textContent = 'Could not save your data in this browser: changes will be lost on reload.';
      }
    }

    function defaultState() { return { members: [], expenses: [], settlements: [] }; }

    // ── State ─────────────────────────────────────────────────────────────────

    let state = load();

    // ── Helpers ───────────────────────────────────────────────────────────────

    function fmt(n) { return '€\u202f' + n.toFixed(2); }

    function fmtDate(iso) {
      if (!iso || isNaN(new Date(iso))) return '';
      return new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Today's date in the user's local time zone, as YYYY-MM-DD
    function today() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function memberOptions() {
      if (state.members.length === 0)
        return '<option value="">— add friends first —</option>';
      return state.members.map(m => `<option value="${escHtml(m)}">${escHtml(m)}</option>`).join('');
    }

    // Parses an amount field: returns a number rounded to cents, or null if unusable.
    function parseAmount(raw) {
      const n = round2(parseFloat(raw));
      return validAmount(n) ? n : null;
    }

    function setError(id, msg) { document.getElementById(id).textContent = msg; }
    function clearError(id)    { document.getElementById(id).textContent = ''; }

    // ── Render groups ─────────────────────────────────────────────────────────

    // Called when members change (add/remove)
    function onMembersChanged() {
      renderMembers();
      renderExpenseForm();
      renderSettleForm();
      renderBalances();
    }

    // Called when expenses or settlements change
    function onLedgerChanged() {
      renderMembers(); // re-evaluate which remove buttons are disabled
      renderExpenses();
      renderSettlements();
      renderBalances();
    }

    function renderAll() {
      renderMembers();
      renderExpenseForm();
      renderExpenses();
      renderBalances();
      renderSettleForm();
      renderSettlements();
    }

    // ── Render: Members ───────────────────────────────────────────────────────

    function renderMembers() {
      const list = document.getElementById('member-list');
      list.innerHTML = '';

      if (state.members.length === 0) {
        list.innerHTML = '<span style="font-size:0.85rem;color:#6b6b6b">No friends yet.</span>';
        return;
      }

      // Precompute which members are referenced, to avoid scanning per-member
      const used = new Set();
      for (const e of state.expenses) {
        used.add(e.paidBy);
        for (const p of e.participants) used.add(p);
      }
      for (const s of state.settlements) { used.add(s.from); used.add(s.to); }

      for (const name of state.members) {
        const tag = document.createElement('div');
        tag.className = 'member-tag';
        const isUsed = used.has(name);
        tag.innerHTML = `${escHtml(name)} <button title="${isUsed ? 'In use' : 'Remove'}" aria-label="${isUsed ? 'Cannot remove ' + escHtml(name) + ' (in use)' : 'Remove ' + escHtml(name)}" ${isUsed ? 'disabled' : ''}>✕</button>`;
        tag.querySelector('button').addEventListener('click', () => removeMember(name));
        list.appendChild(tag);
      }
    }

    // ── Render: Expense form ──────────────────────────────────────────────────

    function renderExpenseForm() {
      const paidBySel = document.getElementById('exp-paid-by');
      const participantsEl = document.getElementById('exp-participants');
      const prevPaidBy = paidBySel.value;

      paidBySel.innerHTML = memberOptions();

      if (state.members.length === 0) {
        participantsEl.innerHTML = '<span style="font-size:0.85rem;color:#6b6b6b">No friends yet.</span>';
        return;
      }

      if (state.members.includes(prevPaidBy)) paidBySel.value = prevPaidBy;

      // Members not in prevUnchecked are checked by default (covers newly added members)
      const prevUnchecked = new Set(
        [...participantsEl.querySelectorAll('input:not(:checked)')].map(i => i.value)
      );

      participantsEl.innerHTML = '';
      for (const m of state.members) {
        const label = document.createElement('label');
        label.className = 'checkbox-label';
        const checked = !prevUnchecked.has(m);
        label.innerHTML = `<input type="checkbox" value="${escHtml(m)}" ${checked ? 'checked' : ''}> ${escHtml(m)}`;
        participantsEl.appendChild(label);
      }
    }

    // ── Render: Expenses list ─────────────────────────────────────────────────

    function renderExpenses() {
      const list = document.getElementById('expense-list');
      list.innerHTML = '';

      if (state.expenses.length === 0) {
        list.innerHTML = '<div class="empty">No expenses yet.</div>';
        return;
      }

      for (let i = state.expenses.length - 1; i >= 0; i--) {
        const exp = state.expenses[i];
        const div = document.createElement('div');
        div.className = 'expense-item';
        div.innerHTML = `
          <div class="expense-meta">
            <div class="expense-desc">${escHtml(exp.description)}</div>
            <div class="expense-sub">
              ${fmtDate(exp.date)} &middot; paid by ${escHtml(exp.paidBy)}
              &middot; ${exp.participants.length} ${exp.participants.length === 1 ? 'person' : 'people'}
            </div>
          </div>
          <div class="expense-amount">${fmt(exp.amount)}</div>
          <button class="icon-btn" title="Delete expense" aria-label="Delete expense ${escHtml(exp.description)}">✕</button>
        `;
        div.querySelector('button').addEventListener('click', () => deleteEntry('expenses', exp.id));
        list.appendChild(div);
      }
    }

    // ── Render: Balances ──────────────────────────────────────────────────────

    function renderBalances() {
      const balList = document.getElementById('balance-list');
      const txSection = document.getElementById('transactions-section');
      const txList = document.getElementById('transaction-list');

      if (state.members.length === 0) {
        balList.innerHTML = '<div class="empty">Add friends to see balances.</div>';
        txSection.style.display = 'none';
        return;
      }

      const balances = computeBalances(state.members, state.expenses, state.settlements);
      balList.innerHTML = '';

      for (const [name, bal] of Object.entries(balances)) {
        const div = document.createElement('div');
        div.className = 'balance-item';
        let amountHtml;
        if (bal > 0)      amountHtml = `<span class="positive">gets back ${fmt(bal)}</span>`;
        else if (bal < 0) amountHtml = `<span class="negative">owes ${fmt(-bal)}</span>`;
        else              amountHtml = `<span class="zero">settled up</span>`;
        div.innerHTML = `<span class="balance-name">${escHtml(name)}</span>${amountHtml}`;
        balList.appendChild(div);
      }

      const transactions = simplifyDebts(balances);
      if (transactions.length === 0) {
        txSection.style.display = 'none';
        return;
      }

      txSection.style.display = 'block';
      txList.innerHTML = '';
      for (const tx of transactions) {
        const div = document.createElement('div');
        div.className = 'transaction-item';
        div.innerHTML = `
          <span class="transaction-text">
            <strong>${escHtml(tx.from)}</strong> &rarr; <strong>${escHtml(tx.to)}</strong>
          </span>
          <span class="transaction-amount">${fmt(tx.amount)}</span>
          <button class="small" aria-label="Record payment from ${escHtml(tx.from)} to ${escHtml(tx.to)}">Record</button>
        `;
        div.querySelector('button').addEventListener('click', () => prefillSettlement(tx));
        txList.appendChild(div);
      }
    }

    // ── Render: Settle form & list ────────────────────────────────────────────

    function renderSettleForm() {
      const fromSel = document.getElementById('set-from');
      const toSel = document.getElementById('set-to');
      const prevFrom = fromSel.value;
      const prevTo = toSel.value;
      const opts = memberOptions();

      fromSel.innerHTML = opts;
      if (state.members.includes(prevFrom)) fromSel.value = prevFrom;

      // With a single friend there is nobody to pay: leave "To" empty instead of repeating the same name
      if (state.members.length === 1) {
        toSel.innerHTML = '<option value="">— add another friend —</option>';
        return;
      }

      toSel.innerHTML = opts;
      if (state.members.includes(prevTo) && prevTo !== fromSel.value) toSel.value = prevTo;
      else toSel.value = state.members.find(m => m !== fromSel.value) ?? '';
    }

    function renderSettlements() {
      const container = document.getElementById('settlement-list');

      if (state.settlements.length === 0) {
        container.style.display = 'none';
        container.innerHTML = '';
        return;
      }

      container.style.display = 'block';
      container.innerHTML = '';

      for (let i = state.settlements.length - 1; i >= 0; i--) {
        const s = state.settlements[i];
        const div = document.createElement('div');
        div.className = 'settlement-item';
        div.innerHTML = `
          <span class="settlement-text">
            ${fmtDate(s.date)} &middot;
            <strong>${escHtml(s.from)}</strong> paid <strong>${escHtml(s.to)}</strong>
          </span>
          <span class="settlement-amount">${fmt(s.amount)}</span>
          <button class="icon-btn" title="Delete settlement" aria-label="Delete settlement from ${escHtml(s.from)} to ${escHtml(s.to)}">✕</button>
        `;
        div.querySelector('button').addEventListener('click', () => deleteEntry('settlements', s.id));
        container.appendChild(div);
      }
    }

    function prefillSettlement(tx) {
      document.getElementById('set-from').value = tx.from;
      document.getElementById('set-to').value = tx.to;
      document.getElementById('set-amount').value = tx.amount.toFixed(2);
      document.getElementById('set-from').closest('.card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ── Actions: Members ──────────────────────────────────────────────────────

    function addMember() {
      clearError('member-error');
      const input = document.getElementById('member-input');
      const name = input.value.trim().replace(/\s+/g, ' ');
      if (!name) return;
      if (state.members.includes(name)) {
        setError('member-error', `"${name}" is already in the group.`);
        return;
      }
      state.members.push(name);
      save(state);
      input.value = '';
      onMembersChanged();
    }

    function removeMember(name) {
      state.members = state.members.filter(m => m !== name);
      save(state);
      onMembersChanged();
    }

    // ── Actions: Expenses & Settlements ──────────────────────────────────────

    function deleteEntry(key, id) {
      state[key] = state[key].filter(e => e.id !== id);
      save(state);
      onLedgerChanged();
    }

    function addExpense() {
      clearError('exp-error');
      const desc = document.getElementById('exp-desc').value.trim();
      const amount = parseAmount(document.getElementById('exp-amount').value);
      const paidBy = document.getElementById('exp-paid-by').value;
      const participants = [...document.querySelectorAll('#exp-participants input:checked')].map(c => c.value);

      if (!desc)                     { setError('exp-error', 'Please enter a description.'); return; }
      if (amount === null)           { setError('exp-error', 'Please enter a valid amount (0.01 to 1,000,000,000).'); return; }
      if (!paidBy)                   { setError('exp-error', 'Please select who paid.'); return; }
      if (participants.length === 0) { setError('exp-error', 'Select at least one participant.'); return; }

      state.expenses.push({
        id: uid(),
        description: desc,
        amount,
        paidBy,
        participants,
        date: today(),
      });
      save(state);
      document.getElementById('exp-desc').value = '';
      document.getElementById('exp-amount').value = '';
      // every expense starts with everyone selected again
      document.querySelectorAll('#exp-participants input').forEach(c => { c.checked = true; });
      onLedgerChanged();
    }

    function addSettlement() {
      clearError('set-error');
      const from = document.getElementById('set-from').value;
      const to = document.getElementById('set-to').value;
      const amount = parseAmount(document.getElementById('set-amount').value);

      if (!from || !to)           { setError('set-error', 'Select both people.'); return; }
      if (from === to)            { setError('set-error', 'A person cannot pay themselves.'); return; }
      if (amount === null)        { setError('set-error', 'Please enter a valid amount (0.01 to 1,000,000,000).'); return; }

      state.settlements.push({
        id: uid(),
        from,
        to,
        amount,
        date: today(),
      });
      save(state);
      document.getElementById('set-amount').value = '';
      onLedgerChanged();
    }

    // ── Event listeners ───────────────────────────────────────────────────────

    document.getElementById('member-add-btn').addEventListener('click', addMember);
    document.getElementById('member-input').addEventListener('keydown', e => { if (e.key === 'Enter') addMember(); });
    document.getElementById('exp-add-btn').addEventListener('click', addExpense);
    document.getElementById('exp-desc').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });
    document.getElementById('exp-amount').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });
    document.getElementById('set-add-btn').addEventListener('click', addSettlement);
    document.getElementById('set-amount').addEventListener('keydown', e => { if (e.key === 'Enter') addSettlement(); });
    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm('Reset everything? All data will be lost.')) {
        state = defaultState();
        save(state);
        renderAll();
      }
    });

    // ── Init ──────────────────────────────────────────────────────────────────

    renderAll();
  </script>
</body>
</html>
